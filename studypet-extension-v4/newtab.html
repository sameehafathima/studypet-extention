<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyPet New Tab ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ec4899;--pink-d:#be185d;--pink-l:#fce7f3;--pink-ll:#fff0f5;
  --text:#9d174d;--mute:#f472b6;
}
html,body{height:100%;width:100%}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#fdf2f8 0%,#fce7f3 50%,#fbcfe8 100%);
  color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
}
body.dark{background:linear-gradient(135deg,#1a0f1f,#2a1533,#3a1d42);color:#fbcfe8;}
body.dark .card{background:#2a1533;border-color:#4a2955;}
body.dark .clock{color:#fbcfe8;}
body.dark .greeting,.quote-text,.nt-pet-name,.shortcuts-title,.section-title{color:#f9a8d4;}
body.dark input{background:#3a1d42;color:#fbcfe8;border-color:#6d3d7a;}
body.dark .shortcut{background:#3a1d42;border-color:#4a2955;color:#fbcfe8;}
body.dark .shortcut:hover{background:#4a2955;}
body.dark .heatcell{background:#3a1d42;}
body.dark .stat-chip,.nt-speech{background:#2a1533;border-color:#4a2955;color:#fbcfe8;}

.layout{display:flex;align-items:flex-start;gap:48px;padding:24px;flex-wrap:wrap;justify-content:center;}
.left{display:flex;flex-direction:column;align-items:center;gap:16px;width:380px;}
.right{display:flex;flex-direction:column;align-items:center;gap:12px;width:320px;}
.full-row{width:100%;max-width:780px;}

.clock-wrap{text-align:center;}
.clock{font-size:72px;font-weight:900;letter-spacing:-2px;color:var(--pink-d);line-height:1;text-shadow:0 2px 20px rgba(236,72,153,0.2);}
.date{font-size:16px;font-weight:700;color:var(--mute);margin-top:4px;}
.greeting{font-size:22px;font-weight:800;color:var(--pink-d);text-align:center;}

.card{background:white;border:2px solid #f9a8d4;border-radius:20px;padding:16px 20px;box-shadow:0 8px 32px rgba(236,72,153,0.15);text-align:center;width:100%;}
.quote-text{font-size:13px;font-weight:600;color:var(--text);line-height:1.6;font-style:italic;}
.quote-author{font-size:11px;font-weight:700;color:var(--mute);margin-top:6px;}
.affirm{font-size:13px;font-weight:800;color:var(--pink-d);margin-top:10px;padding-top:10px;border-top:1px dashed #f9a8d4;}

.shortcuts-section{display:flex;flex-direction:column;gap:8px;width:100%;}
.section-title,.shortcuts-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mute);}
.shortcuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.shortcut{background:white;border:2px solid #f9a8d4;border-radius:14px;padding:10px;text-align:center;cursor:pointer;text-decoration:none;color:var(--text);font-size:12px;font-weight:700;transition:all 0.2s;display:flex;align-items:center;gap:8px;}
.shortcut:hover{background:var(--pink-ll);transform:translateY(-2px);box-shadow:0 4px 12px rgba(236,72,153,0.2);}
.shortcut-icon{font-size:18px;flex-shrink:0;}
.shortcut-label{font-size:11px;font-weight:700;text-align:left;}
.shortcut-url{font-size:9px;color:var(--mute);font-weight:600;}
.add-shortcut{border-style:dashed;cursor:pointer;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px;}
.add-shortcut:hover{background:var(--pink-ll);}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-overlay.open{display:flex;}
.modal{background:white;border:2px solid #f9a8d4;border-radius:20px;padding:24px;width:300px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal h3{font-size:16px;font-weight:900;color:var(--pink-d);margin-bottom:16px;}
.modal input{width:100%;border:2px solid #f9a8d4;border-radius:10px;padding:8px 12px;font-family:inherit;font-size:13px;color:var(--text);outline:none;margin-bottom:10px;}
.modal input:focus{border-color:var(--pink);}
.modal-btns{display:flex;gap:8px;margin-top:4px;}
.btn-primary{flex:1;background:linear-gradient(135deg,var(--pink),var(--pink-d));color:white;border:none;border-radius:10px;padding:10px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px;}
.btn-ghost{flex:1;background:var(--pink-l);color:var(--pink-d);border:none;border-radius:10px;padding:10px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px;}

.nt-pet-wrap{position:relative;cursor:pointer;}
.nt-pet-svg{width:120px;height:120px;filter:drop-shadow(0 8px 20px rgba(249,168,212,0.6));animation:nt-bob 2s ease-in-out infinite;}
@keyframes nt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.nt-pet-name{font-size:16px;font-weight:900;color:var(--pink-d);text-align:center;}
.evo-badge{display:inline-block;background:linear-gradient(135deg,var(--pink),var(--pink-d));color:white;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-left:6px;}
.nt-speech{background:white;border:2px solid #f9a8d4;border-radius:14px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--text);max-width:240px;text-align:center;box-shadow:0 4px 12px rgba(236,72,153,0.15);position:relative;min-height:36px;display:flex;align-items:center;justify-content:center;}
.nt-speech::after{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom-color:#f9a8d4;border-top:none;}

.stats-row{display:flex;gap:10px;}
.stat-chip{background:white;border:2px solid #f9a8d4;border-radius:12px;padding:8px 12px;text-align:center;min-width:70px;}
.stat-num{font-size:18px;font-weight:900;color:var(--pink);}
.stat-label{font-size:9px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:0.5px;}

.focus-row{width:100%;display:flex;align-items:center;gap:8px;margin-top:4px;}
.focus-input{flex:1;border:2px solid #f9a8d4;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:13px;font-weight:700;color:var(--text);outline:none;background:white;}
.focus-input:focus{border-color:var(--pink);}
.focus-btn{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:white;border:none;border-radius:12px;padding:8px 14px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;}

.top-bar{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:10;}
.icon-btn{background:rgba(255,255,255,0.6);border:2px solid #f9a8d4;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:14px;transition:all 0.2s;}
.icon-btn:hover{background:var(--pink-l);}

/* Heatmap */
.heatmap-wrap{background:white;border:2px solid #f9a8d4;border-radius:20px;padding:18px 20px;width:100%;box-shadow:0 8px 32px rgba(236,72,153,0.12);}
.heatmap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.heatmap{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px;}
.heatcell{width:14px;height:14px;border-radius:3px;background:#fce7f3;transition:transform 0.15s;}
.heatcell:hover{transform:scale(1.4);z-index:2;}
.heatcell.l1{background:#fbcfe8}.heatcell.l2{background:#f9a8d4}
.heatcell.l3{background:#f472b6}.heatcell.l4{background:#ec4899}.heatcell.l5{background:#be185d}
.legend{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--mute);}

/* Site time bars */
.sitetime-wrap{background:white;border:2px solid #f9a8d4;border-radius:20px;padding:18px 20px;width:100%;box-shadow:0 8px 32px rgba(236,72,153,0.12);}
.bar-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;font-weight:700;}
.bar-label{flex:0 0 150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.bar-track{flex:1;background:#fce7f3;border-radius:999px;height:10px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-d));border-radius:999px;}
.bar-value{flex:0 0 55px;text-align:right;color:var(--pink-d);font-weight:800;}
.empty{font-size:12px;font-weight:700;color:var(--mute);text-align:center;padding:12px;}
</style>
</head>
<body>
<div class="top-bar">
  <button class="icon-btn" id="btn-dark" title="Toggle dark mode" data-testid="nt-dark-toggle">🌙</button>
  <button class="icon-btn" id="btn-popup" title="Open mini-game" data-testid="nt-open-minigame">🎮</button>
</div>

<div class="layout">
  <div class="left">
    <div class="clock-wrap">
      <div class="clock" id="nt-clock" data-testid="nt-clock">00:00</div>
      <div class="date" id="nt-date">Loading...</div>
    </div>
    <div class="greeting" id="nt-greeting">Good morning! ☀️</div>

    <div class="card">
      <div class="quote-text" id="nt-quote-text" data-testid="nt-quote">Loading inspiration...</div>
      <div class="quote-author" id="nt-quote-author">— StudyPet</div>
      <div class="affirm" id="nt-affirm" data-testid="nt-affirmation">Today's affirmation…</div>
    </div>

    <div class="focus-row">
      <input class="focus-input" id="nt-intention" type="text" placeholder="What are you studying today?" maxlength="80" data-testid="nt-intention-input"/>
      <button class="focus-btn" id="nt-save-intention" data-testid="nt-save-intention">✓ Set</button>
    </div>

    <div class="shortcuts-section">
      <div class="shortcuts-title">Quick Links</div>
      <div class="shortcuts-grid" id="shortcuts-grid"></div>
    </div>
  </div>

  <div class="right">
    <div class="nt-pet-wrap" id="nt-pet-wrap" data-testid="nt-pet">
      <svg class="nt-pet-svg" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" id="nt-pet-svg">
        <ellipse cx="36" cy="70" rx="20" ry="4" fill="#f9a8d4" opacity="0.3"/>
        <ellipse cx="36" cy="50" rx="18" ry="16" fill="#fce7f3"/>
        <ellipse cx="20" cy="46" rx="6" ry="4" fill="#f9a8d4" opacity="0.5"/>
        <ellipse cx="52" cy="46" rx="6" ry="4" fill="#f9a8d4" opacity="0.5"/>
        <ellipse cx="36" cy="30" rx="20" ry="18" fill="#fce7f3"/>
        <ellipse cx="18" cy="16" rx="7" ry="10" fill="#fce7f3" transform="rotate(-15,18,16)"/>
        <ellipse cx="18" cy="16" rx="4" ry="6" fill="#f9a8d4" transform="rotate(-15,18,16)" opacity="0.7"/>
        <ellipse cx="54" cy="16" rx="7" ry="10" fill="#fce7f3" transform="rotate(15,54,16)"/>
        <ellipse cx="54" cy="16" rx="4" ry="6" fill="#f9a8d4" transform="rotate(15,54,16)" opacity="0.7"/>
        <ellipse cx="54" cy="55" rx="8" ry="6" fill="#fbcfe8" transform="rotate(20,54,55)"/>
        <ellipse cx="28" cy="36" rx="5" ry="6" fill="#9d174d" opacity="0.8"/>
        <ellipse cx="44" cy="36" rx="5" ry="6" fill="#9d174d" opacity="0.8"/>
        <ellipse cx="28" cy="34" rx="2" ry="2.5" fill="white" opacity="0.6"/>
        <ellipse cx="44" cy="34" rx="2" ry="2.5" fill="white" opacity="0.6"/>
        <path d="M 26 44 Q 36 50 46 44" stroke="#9d174d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="26" cy="62" rx="8" ry="5" fill="#fbcfe8"/>
        <ellipse cx="46" cy="62" rx="8" ry="5" fill="#fbcfe8"/>
        <ellipse cx="36" cy="42" rx="3" ry="2" fill="#f9a8d4"/>
      </svg>
    </div>
    <div class="nt-pet-name"><span id="nt-pet-name">Mochi</span> 🌸<span class="evo-badge" id="nt-evo">Bunny</span></div>
    <div class="nt-speech" id="nt-speech">Hello! Ready to study? 💪</div>

    <div class="stats-row">
      <div class="stat-chip"><div class="stat-num" id="nt-level" data-testid="nt-level">1</div><div class="stat-label">Level</div></div>
      <div class="stat-chip"><div class="stat-num" id="nt-streak" data-testid="nt-streak">0</div><div class="stat-label">Streak 🔥</div></div>
      <div class="stat-chip"><div class="stat-num" id="nt-hours" data-testid="nt-hours">0m</div><div class="stat-label">Today</div></div>
    </div>
  </div>
</div>

<!-- Heatmap (full width below) -->
<div class="full-row" style="margin-top:24px;display:flex;flex-direction:column;gap:20px;">
  <div class="heatmap-wrap">
    <div class="heatmap-head">
      <div class="section-title">Focus heatmap — last 12 weeks</div>
      <div class="legend">less <span class="heatcell l0"></span><span class="heatcell l1"></span><span class="heatcell l2"></span><span class="heatcell l3"></span><span class="heatcell l4"></span><span class="heatcell l5"></span> more</div>
    </div>
    <div class="heatmap" id="heatmap" data-testid="nt-heatmap"></div>
  </div>

  <div class="sitetime-wrap">
    <div class="section-title">Time spent on sites today</div>
    <div id="sitetime-list" data-testid="nt-sitetime"><div class="empty">No activity tracked yet — browse a bit!</div></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Add Quick Link 🔗</h3>
    <input id="modal-label" type="text" placeholder="Label (e.g. Gmail)" maxlength="20"/>
    <input id="modal-url" type="url" placeholder="URL (e.g. https://gmail.com)" maxlength="200"/>
    <input id="modal-icon" type="text" placeholder="Emoji icon (e.g. 📧)" maxlength="4"/>
    <div class="modal-btns">
      <button class="btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-save">Add Link</button>
    </div>
  </div>
</div>

<script src="newtab.js"></script>
</body>
</html>
